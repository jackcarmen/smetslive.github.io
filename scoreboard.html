<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Game Center</title>

<style>
body {
  margin: 0;
  background: #002D72;
}

/* Container */
#scorebug {
  color: white;
  padding: 14px;
  font-family: Arial;
  max-width: 800px;
  margin: auto;
}

/* HEADER */
#header {
  width: 100%;
}

.headerRow {
  display: grid;
  grid-template-columns: 80px 1fr 80px;
  align-items: center;
  margin-bottom: 2px;
}

.logo {
  width: 32px;
  height: 32px;
  justify-self: center;
}

#teams {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

/* RECORD + VENUE */
#venue,
#awayRecord,
#homeRecord {
  text-align: center;
  font-size: 12px;
  color: #ccc;
  margin-top: 4px;
}

/* SCORE */
#score {
  font-size: 28px;
  margin: 6px 0;
  text-align: center;
}

/* STATUS */
#inning {
  text-align: center;
  font-size: 14px;
  margin-top: 6px;
  padding: 4px 10px;
  border-radius: 6px;
  display: block;
  width: fit-content;
  margin-left: auto;
  margin-right: auto;
  font-weight: bold;
}

.inning-live { background: none; }
.inning-final { background: #787878; }
.inning-scheduled { background: #f47d30; }

/* MATCHUP */
#matchup {
  text-align: center;
  margin: 8px 0;
  font-size: 13px;
  font-weight: bold;
}

/* LINEUPS */
#lineups {
  display: flex;
  gap: 16px;
  margin-top: 12px;
}

.lineup {
  width: 50%;
  font-size: 13px;
}

#awayLineup { text-align: left; }
#homeLineup { text-align: right; }

</style>
</head>

<body>

<div id="scorebug">

  <div id="header">
    <div class="headerRow">
      <img id="awayLogo" class="logo">
      <div id="teams"></div>
      <img id="homeLogo" class="logo">
    </div>

    <div class="headerRow">
      <div id="awayRecord"></div>
      <div id="venue"></div>
      <div id="homeRecord"></div>
    </div>
  </div>

  <div id="score"></div>
  <div id="inning"></div>

  <div id="matchup"></div>

  <div id="diamond">
    <div class="base" id="first"></div>
    <div class="base" id="second"></div>
    <div class="base" id="third"></div>
  </div>

  <div id="lineups">
    <div id="awayLineup" class="lineup"></div>
    <div id="homeLineup" class="lineup"></div>
  </div>

</div>

<script>
async function loadScore() {
  try {
    const res = await fetch(
      "https://statsapi.mlb.com/api/v1/schedule?sportId=11&teamId=552"
    );
    const sched = await res.json();
    const game = sched.dates[0]?.games[0];
    if (!game) return;

    // ✅ Team info
    document.getElementById("teams").innerText =
      game.teams.away.team.name + " @ " +
      game.teams.home.team.name;

    document.getElementById("awayLogo").src =
      "https://www.mlbstatic.com/team-logos/" +
      game.teams.away.team.id + ".svg";

    document.getElementById("homeLogo").src =
      "https://www.mlbstatic.com/team-logos/" +
      game.teams.home.team.id + ".svg";

    document.getElementById("venue").innerText = game.venue.name;

    document.getElementById("awayRecord").innerText =
      game.teams.away.leagueRecord.wins + "-" +
      game.teams.away.leagueRecord.losses;

    document.getElementById("homeRecord").innerText =
      game.teams.home.leagueRecord.wins + "-" +
      game.teams.home.leagueRecord.losses;

    // ✅ Live data
    const liveRes = await fetch(
      `https://statsapi.mlb.com/api/v1.1/game/${game.gamePk}/feed/live`
    );
    const live = await liveRes.json();

    const status = game.status.detailedState;
    const linescore = live.liveData?.linescore;

    // ✅ Score
    if (linescore) {
      document.getElementById("score").innerText =
        linescore.teams.away.runs + " - " +
        linescore.teams.home.runs;
    }

    // ✅ Inning / Status
    const inningEl = document.getElementById("inning");
    inningEl.className = "";

    const gameTime = new Date(game.gameDate).toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit"
    });

    if (!linescore) {
      inningEl.innerText = gameTime;
      inningEl.classList.add("inning-scheduled");

    } else if (status === "Final") {
      inningEl.innerText = "Final";
      inningEl.classList.add("inning-final");

    } else if (status.includes("In Progress")) {
      inningEl.innerText =
        linescore.inningState + " " +
        linescore.currentInningOrdinal;
      inningEl.classList.add("inning-live");

    } else {
      inningEl.innerText = gameTime;
      inningEl.classList.add("inning-scheduled");
    }

    // ✅ Matchup
    const matchupEl = document.getElementById("matchup");
    matchupEl.innerText = "";

    if (status.includes("In Progress") &&
        live.liveData?.plays?.currentPlay?.matchup) {

      const m = live.liveData.plays.currentPlay.matchup;

      matchupEl.innerText =
        "P: " + m.pitcher.fullName +
        " vs B: " + m.batter.fullName;

    } else if (!linescore) {

      const awayP = game.teams.away.probablePitcher;
      const homeP = game.teams.home.probablePitcher;

      if (awayP && homeP) {
        matchupEl.innerText =
          "Probable: " +
          awayP.fullName + " vs " +
          homeP.fullName;
      }
    }

    // ✅ Lineups
    const box = live.liveData?.boxscore;

    if (box) {
      function buildLineup(teamBox, label) {
        const order = teamBox.battingOrder;

        if (!order || order.length === 0) {
          return "<strong>" + label + ":</strong><br>Not available";
        }

        const players = order.map(id =>
          teamBox.players["ID" + id].person.fullName
        );

        return "<strong>" + label + ":</strong><br>" +
          players.map((p, i) => (i + 1) + ". " + p).join("<br>");
      }

      document.getElementById("awayLineup").innerHTML =
        buildLineup(box.teams.away, "Away");

      document.getElementById("homeLineup").innerHTML =
        buildLineup(box.teams.home, "Home");
    }

  } catch (e) {
    console.log(e);
  }
}

loadScore();
setInterval(loadScore, 20000);
</script>

</body>
</html>
