<!DOCTYPE html>
<html>
<head>
  <style>
  /* GLOBAL */
body {
  margin: 0;
  background: transparent;
  font-family: Arial;
  width: auto;
}

:root{
  --column-width: clamp(160px, 40vw, 800px);
}

#scorebug {
  background: transparent;
  color: white;
  font-family: Arial;
  width: 100%;
  margin: auto;
  box-sizing: border-box;
  padding: clamp(20px, 5vw, 100px) 0;
}

/* VENUE */
#venue {
  text-align: center;
  align-content: center;
  font-size: clamp(16px, 4vw,80px);
  color: #CCC;
  margin-bottom: clamp(20px,5vw,100px);
}

/* GRID (logos + teams aligned) */
#matchupGrid {
  display: grid;
  grid-template-columns: var(--column-width) auto var(--column-width);
  align-items: center;
  justify-items: center;
  justify-content: center;
  margin: clamp(20px,5vw,100px) auto;
  row-gap: 6px;
  max-width: 2000px;
}

/* Logos */
.logo {
  width: clamp(80px, 20vw, 400px);
  height: clamp(80px, 20vw, 400px);
}

/* @ symbol */
#atSymbol {
  font-size: clamp(20px, 5vw, 100px);
  font-weight: bold;
}

/* Teams */
#awayTeam,
#homeTeam {
  font-size: clamp(16px, 4vw, 80px);
  text-align: center;
  margin: clamp(12px,3vw,60px) auto 0;
  color: white;
  max-width: var(--column-width);
}

/* SCORE */
#score {
  font-size: clamp(80px, 20vw, 400px);
  margin: clamp(20px,5vw,100px) auto;
  text-align: center;
  font-weight: bold;
}

/* INNING */
#inning {
  text-align: center;
  margin: 10px auto;
  padding: 4px 15px;
  border-radius: 6px;
  width: fit-content;
  font-weight: bold;
}

/* STATUS COLORS */
.inning-live {
  background: #f47d30;
  font-size: clamp(20px, 5vw, 100px)
}

.inning-final {
  background: #787878;
  font-size: clamp(20px,5vw,100px)
}

.inning-scheduled {
  background: none;
  font-size: clamp(24px,6vw,120px)
}

.inning-delayed {
  background: red;
  font-size: clamp(20px, 5vw, 100px);
}

/* OUTS */
#outs {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 12px;
}

.outs-label {
  font-size: clamp(16px, 4vw, 80px);
  margin-right: 6px;
  display: flex;
  align-items: center;
}

.out{
  width: clamp(12px,3vw,60px);
  height: clamp(12px,3vw,60px);
  background: #ccc;
  border-radius: 50%;
  opacity: 0.6;
  transition: 0.2s;
  margin: clamp(8px, 2vw, 40px) clamp(4px,1vw,5px);
}

.out.active {
  background: #f47d30;
  opacity: 1;
}

/* MATCHUP */
#matchup {
  text-align: center;
  margin: 20px 0;
  font-size: clamp(16px, 4vw, 80px);
}

/* BASE DIAMOND */
#diamond {
  position: relative;
  width: clamp(60px, 15vw, 300px);
  height: clamp(60px, 15vw, 300px);
  margin: 20px auto 0;
}

.base {
  width: clamp(20px, 5vw, 100px);
  height: clamp(20px, 5vw, 100px);
  background: #ccc;
  position: absolute;
  transform: rotate(45deg);
  opacity: 0.4;
  transition: 0.2s;
}

/* Active runner */
.base.active {
  background: #f47d30;
  opacity: 1;
}

/* Base positions */


#first {
  right: 0;
  top: 50%;
  transform: translateY(-50%) rotate(45deg);
}

#second {
  left: 50%;
  top: 0%;
  transform: translateX(-50%) rotate(45deg);
}

#third {
  left: 0;
  top: 50%;
  transform: translateY(-50%) rotate(45deg);
}

/* LINEUPS */
#lineups {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 10px;
  max-width: 2000px;
  margin-left: auto;
  margin-right: auto;
  padding: 0 6px;
}

.lineup {
  width: var(--column-width);
  font-size: clamp(16px, 4vw, 80px);
  line-height: 1.4;
}

#awayLineup {
  text-align: left;
}

#homeLineup {
  text-align: right;
}

.record {
  font-size: clamp(12px, 3vw, 60px);
  color: #CCC;
  /* margin: clamp(12px,3vw,60px) auto; */
  text-align: center;
}

#gameHistory {
  display: flex;
  overflow-x: auto;
  overflow-y: hidden;
  gap: 12px;

  margin: 10px 0 40px 0;
  padding: 10px;

  justify-content: flex-start;

  box-sizing: border-box;
}

.gameCard {
  width: clamp(80px,20vw,400px);
  height: clamp(100px,25vw,500px);

  font-size: clamp(10px,2vw,40px);
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  align-items: center;
  background: rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: clamp(8px,2vw,40px);

  text-align: center;
  flex-shrink: 0;

  box-sizing: border-box;
}

.gameCard img{
  width: clamp(40px,10vw,200px);
  height: clamp(40px,10vw,200px);
}

.win {
  border: clamp(2px, 0.5vw, 10px) solid rgba(76,175,80,.8);
}

.loss {
  border: clamp(2px, 0.5vw, 10px) solid rgba(231,76,60,.8);
}

.gameDate {
  font-size: clamp(12px, 3vw, 60px);
}

.gameResult {
  font-size: clamp(12px, 3vw, 60px);
  font-weight: bold;
}

.gameLocation {
  font-size: clamp(12px, 3vw, 60px);
}

#gameHistoryTitle{
  text-align: center;
  font-size: clamp(16px,4vw,80px);
  margin-top: 40px;
  font-weight: bold;
}
</style>  
</head>

<div id="scorebug">

  <!-- Venue -->
  <div id="venue"></div>

  <!-- Logo + Team grid -->
  <div id="matchupGrid">

    <img id="awayLogo" class="logo">
    <div id="atSymbol">VS</div>
    <img id="homeLogo" class="logo">

    <div id="awayTeam"></div>
    <div></div>
    <div id="homeTeam"></div>
    <div id="awayRecord" class="record"></div>
    <div></div>
    <div id="homeRecord" class="record"></div>

  </div>

  <!-- Score -->
  <div id="score"></div>

  <!-- Inning / Status -->
  <div id="inning"></div>
  <div id="outs">
    <span class="outs-label">Outs:</span>
    <span class="out"></span>
    <span class="out"></span>
  </div>


  <!-- Diamond -->
  <div id="diamond">
    <div class="base" id="first"></div>
    <div class="base" id="second"></div>
    <div class="base" id="third"></div>
  </div>

  <!-- Matchup -->
  <div id="matchup"></div>
  
    <!-- Lineups -->
 <div id="lineups">   
    <div id="awayLineup" class="lineup"></div>
    <div id="homeLineup" class="lineup"></div>
  </div>
  
  <!-- Past Games -->
  <div id="gameHistoryTitle">Previous Games</div>
  <div id="gameHistory"></div>

<script>
async function loadScore() {
  try {
    // ✅ Get today's game
    const today = new Date();

// Game
const future = new Date();
future.setDate(today.getDate() + 30);

const formatDate = d => d.toISOString().split("T")[0];

const res = await fetch(
  `https://statsapi.mlb.com/api/v1/schedule?sportId=11&teamId=552`
);
    const sched = await res.json();
    
    const historyRes = await fetch(
    `https://statsapi.mlb.com/api/v1/schedule?sportId=11&teamId=552&startDate=2026-03-01&endDate=${formatDate(today)}`);
    
    const historySched = await historyRes.json();

    let game = null;

for (const date of sched.dates || []) {
  const g = date.games;

  if (g && g.length > 0) {
    // prefer live game
    const liveGame = g.find(gm =>
      gm.status.detailedState.includes("In Progress")
    );

    game = liveGame || g[0];
    break;
  }
}


if (!game) {
  console.log("No upcoming games found");
  return;
}

    if (!game) return;

    const status = game.status.detailedState;

    const isLive = status.includes("In Progress");
    const isFinal =
      status.includes("Final") ||
      status.includes("Game Over");
    
    const isDelayed =
          status.includes("Delayed") ||
          status.includes("Suspended");
    
    const isPostponed = 
          status.includes("Postponed") ||
          status.includes("Cancelled");

    // ✅ Team names
    document.getElementById("awayTeam").innerText =
      game.teams.away.team.name;

    document.getElementById("homeTeam").innerText =
      game.teams.home.team.name;
    
    // Records
    const awayRec = game.teams.away.leagueRecord;
    const homeRec = game.teams.home.leagueRecord;
    
    document.getElementById("awayRecord").innerText = 
      awayRec.wins + "-" + awayRec.losses;
    
    document.getElementById("homeRecord").innerText = 
      homeRec.wins + "-" + homeRec.losses;

    // ✅ Logos
    document.getElementById("awayLogo").src =
      "https://www.mlbstatic.com/team-logos/" +
      game.teams.away.team.id + ".svg";

    document.getElementById("homeLogo").src =
      "https://www.mlbstatic.com/team-logos/" +
      game.teams.home.team.id + ".svg";

    // ✅ Venue
    //document.getElementById("venue").innerText =
      //game.venue.name;
    
    const venueEl = document.getElementById("venue");
    const gameDateObj = new Date(game.gameDate);
    //Formatted time
    const gameTime = gameDateObj.toLocaleTimeString([],{hour: "numeric", minute: "2-digit"});
    //Formatted date
    const gameDateShort = gameDateObj.toLocaleDateString([],{month: "short", day:"numeric"});
    //Default
    let venueText = game.venue.name;
    //Live
    if (isLive) {venueText = gameTime + " - " + game.venue.name;}
    //Final
    if (isFinal) {venueText =gameDateShort + ", " + gameTime + " - " + game.venue.name;}
    //Apply
    venueEl.innerText = venueText;
    
    

    // ✅ Get live data
    const liveRes = await fetch(
      `https://statsapi.mlb.com/api/v1.1/game/${game.gamePk}/feed/live`
    );
    const live = await liveRes.json();

    const linescore = live.liveData?.linescore;

    // ✅ SCORE
    const scoreEl = document.getElementById("score");

    if (isLive || isFinal) {
      scoreEl.style.display = "block";

      scoreEl.innerText =
        (linescore?.teams.away.runs || 0) + " - " +
        (linescore?.teams.home.runs || 0);
    } else {
      scoreEl.style.display = "none";
    }

    // ✅ INNING / STATUS
    const inningEl = document.getElementById("inning");
    inningEl.className = "";

    if (isDelayed) {
      inningEl.innerText = status.toUpperCase();
      inningEl.classList.add("inning-delayed");
    }
    
    else if (isPostponed) {
      inningEl.innerText = status.toUpperCase();
      inningEl.classList.add("inning-final");
    }
    
    else if (!isLive && !isFinal && !isDelayed && !isPostponed) {
      const gameDateObj = new Date(game.gameDate);
      const now = new Date();

      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const gameDay = new Date(
        gameDateObj.getFullYear(),
        gameDateObj.getMonth(),
        gameDateObj.getDate()
      );

      const diff = (gameDay - today) / (1000 * 60 * 60 * 24);

      let dateLabel = "";

      if (diff === 0) dateLabel = "Today";
      else if (diff === 1) dateLabel = "Tomorrow";
      else {
        dateLabel = gameDateObj.toLocaleDateString([], {
          month: "short",
          day: "numeric"
        });
      }

      inningEl.innerText = dateLabel + " - " + gameTime;
      inningEl.classList.add("inning-scheduled");

    } else if (isFinal) {
      inningEl.innerText = "FINAL";
      inningEl.classList.add("inning-final");

    } else if (isLive) {
      inningEl.innerText =
        (linescore?.inningState || "") + " " +
        (linescore?.currentInningOrdinal || "");
      inningEl.classList.add("inning-live");
    }
    
    //document.getElementById("inning").innerText +=
  //"\n" + status;


    // ✅ OUTS (ONLY SHOW WHEN LIVE)
    const outsContainer = document.getElementById("outs");

    if (outsContainer) {
      // 🔴 Hide by default
      outsContainer.style.display = "none";

      if (isLive && linescore) {
        // ✅ Show when live
        outsContainer.style.display = "flex";

        const dots = outsContainer.querySelectorAll(".out");

        // Reset dots
        dots.forEach(dot => dot.classList.remove("active"));

        const outs = linescore.outs;

        if (outs === 1) {
          dots[0].classList.add("active");
        } else if (outs === 2) {
          dots[0].classList.add("active");
          dots[1].classList.add("active");
        }
        // 0 or 3 outs = none active ✅
      }
    }

    // ✅ MATCHUP
    const matchupEl = document.getElementById("matchup");
    matchupEl.innerText = "";

    if (isLive && live.liveData?.plays?.currentPlay?.matchup) {
      const m = live.liveData.plays.currentPlay.matchup;

      matchupEl.innerText =
        "P: " + m.pitcher.fullName +
        " vs B: " + m.batter.fullName;

    } else if (!isLive && !isFinal && !isDelayed && !isPostponed) {
      const awayP = game.teams.away.probablePitcher;
      const homeP = game.teams.home.probablePitcher;

      if (awayP && homeP) {
        matchupEl.innerText =
          "Probable: " +
          awayP.fullName + " vs " +
          homeP.fullName;
      }

    } else if (isFinal && live.liveData?.decisions) {
      const win = live.liveData.decisions.winner;
      const loss = live.liveData.decisions.loser;

      if (win && loss) {
        matchupEl.innerText =
          "W: " + win.fullName + " | L: " + loss.fullName;
      }
    }

    // ✅ BASE RUNNERS
    const diamond = document.getElementById("diamond");

    if (diamond) {
      diamond.style.display = "none";

      ["first", "second", "third"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.remove("active");
      });

      if (isLive && linescore?.offense) {
        diamond.style.display = "block";

        if (linescore.offense.first) {
          document.getElementById("first").classList.add("active");
        }
        if (linescore.offense.second) {
          document.getElementById("second").classList.add("active");
        }
        if (linescore.offense.third) {
          document.getElementById("third").classList.add("active");
        }
      }
    }

    // ✅ LINEUPS + SP
    const box = live.liveData?.boxscore;

    if (box) {
      function buildLineup(teamBox, label, probablePitcher) {
        const order = teamBox.battingOrder;

        let pitcherName = "";

        if (probablePitcher && probablePitcher.fullName) {
          pitcherName = probablePitcher.fullName;
        } else if (teamBox.pitchers && teamBox.pitchers.length > 0) {
          const starterId = teamBox.pitchers[0];
          const starter = teamBox.players["ID" + starterId];
          if (starter) pitcherName = starter.person.fullName;
        }

        if (!order || order.length === 0) {
          return "<strong>" + label + ":</strong><br>Lineup not available" +
            (pitcherName ? "<br><br>SP: " + pitcherName : "");
        }

        const players = order.map(id =>
          teamBox.players["ID" + id].person.fullName
        );

        let html =
          "<strong>" + label + ":</strong><br>" +
          players.map((p, i) => (i + 1) + ". " + p).join("<br>");

        if (pitcherName) {
          html += "<br><br><span class='sp'>SP: " + pitcherName + "</span>";
        }

        return html;
      }

      document.getElementById("awayLineup").innerHTML =
        buildLineup(
          box.teams.away,
          "Away",
          game.teams.away.probablePitcher
        );

      document.getElementById("homeLineup").innerHTML =
        buildLineup(
          box.teams.home,
          "Home",
          game.teams.home.probablePitcher
        );
    }
    
    const historyEl = document.getElementById("gameHistory");
    if (historyEl) {
      historyEl.innerHTML = "";
      const completedGames = [];
      for (const date of historySched.dates || []) {
        for (const g of date.games || []) {
          const gameStatus = g.status.detailedState;
          if (
          gameStatus.includes("Final")||
          gameStatus.includes("Game Over")
          ) {
            completedGames.push(g);
          }
        }
      }
    completedGames.reverse();
      completedGames.forEach(g => 
{

    const syracuseHome =
      g.teams.home.team.id === 552;

    const opponent =
      syracuseHome
        ? g.teams.away.team
        : g.teams.home.team;

    const syrScore =
      syracuseHome
        ? g.teams.home.score
        : g.teams.away.score;

    const oppScore =
      syracuseHome
        ? g.teams.away.score
        : g.teams.home.score;

    const result =
      syrScore > oppScore ? "W" : "L";

    const gameDate = new Date(g.gameDate);

    const dateText =
      String(gameDate.getMonth() + 1).padStart(2, "0") +
      "/" +
      String(gameDate.getDate()).padStart(2, "0");

    const card = document.createElement("div");

    card.className =
      "gameCard " +
      (result === "W" ? "win" : "loss");

    card.innerHTML = `
  <div class="gameLocation">
    ${syracuseHome ? "VS" : "@"}
  </div>

  <img
    src="https://www.mlbstatic.com/team-logos/${opponent.id}.svg"
  >

  <div class="gameDate">${dateText}</div>

  <div class="gameResult">
    ${result} ${syrScore}-${oppScore}
  </div>
`;

    historyEl.appendChild(card);

  });

}

   

  } catch (e) {
    console.log("ERROR:", e);
  }
}



// ✅ Run + refresh
loadScore();
setInterval(loadScore, 10000);



</script>  
</body>
  </html>
