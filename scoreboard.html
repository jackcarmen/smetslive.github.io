<!DOCTYPE html>
<html>
<head>
<style>
  /* GLOBAL */
body {
  margin: 0;
  background: transparent;
  font-family: Arial, sans-serif;
}

#scorebug {
  background: transparent;
  color: white;
  padding: 14px;
  font-family: Arial, sans-serif;
  width: 100%;
  margin: auto;
}

/* VENUE */
#venue {
  text-align: center;
  font-size: 12px;
  color: #ccc;
  margin-bottom: 6px;
}

/* GRID (logos + teams aligned) */
#matchupGrid {
  display: grid;
  grid-template-columns: minmax(70px, 1fr) auto minmax(70px, 1fr);
  align-items: center;
  justify-items: center;
  justify-content: center;
  margin: 0 auto;
  margin-top: 10px;
  row-gap: 6px;
  max-width: 400px;
}

/* Logos */
.logo {
  width: 44px;
  height: 44px;
}

/* @ symbol */
#atSymbol {
  font-size: 16px;
  font-weight: bold;
}

/* Teams */
#awayTeam,
#homeTeam {
  font-size: 14px;
  text-align: center;
}

/* SCORE */
#score {
  font-size: 40px;
  margin: 10px 0;
  text-align: center;
  font-weight: bold;
}

/* INNING */
#inning {
  text-align: center;
  font-size: 14px;
  margin: 6px auto;
  padding: 4px 10px;
  border-radius: 6px;
  width: fit-content;
  font-weight: bold;
}

/* STATUS COLORS */
.inning-live {
  background: none;
}

.inning-final {
  background: #787878;
}

.inning-scheduled {
  background: #f47d30;
}

/* OUTS */
#outs {
  text-align: center;
  font-size: 12px;
  margin-top: 4px;
  color: #ccc;
}

/* MATCHUP */
#matchup {
  text-align: center;
  margin: 8px 0;
  font-size: 13px;
  font-weight: bold;
}

/* BASE DIAMOND */
#diamond {
  position: relative;
  width: 80px;
  height: 80px;
  margin: 12px auto;
}

.base {
  width: 16px;
  height: 16px;
  background: #ccc;
  position: absolute;
  transform: rotate(45deg);
  opacity: 0.4;
  transition: 0.2s;
}

/* Active runner */
.base.active {
  background: #f47d30;
  opacity: 1;
}

/* Base positions */
#second {
  top: 0;
  left: 50%;
  transform: translateX(-50%) rotate(45deg);
}

#first {
  right: 0;
  top: 50%;
  transform: translateY(-50%) rotate(45deg);
}

#third {
  left: 0;
  top: 50%;
  transform: translateY(-50%) rotate(45deg);
}

/* LINEUPS */
#lineups {
  display: flex;
  gap: 12px;
  margin-top: 10px;
}

.lineup {
  width: 50%;
  font-size: 12px;
}

#awayLineup {
  text-align: left;
}

#homeLineup {
  text-align: right;
}
</style>
</head>

<body>
<div id="scorebug">

  <!-- Venue -->
  <div id="venue"></div>

  <!-- Logo + Team grid -->
  <div id="matchupGrid">

    <img id="awayLogo" class="logo">
    <div id="atSymbol">VS</div>
    <img id="homeLogo" class="logo">

    <div id="awayTeam"></div>
    <div></div>
    <div id="homeTeam"></div>

  </div>

  <!-- Score -->
  <div id="score"></div>

  <!-- Inning / Status -->
  <div id="inning"></div>
  <div id="outs"></div>


  <!-- Matchup -->
  <div id="matchup"></div>

  <!-- Diamond -->
  <div id="diamond">
    <div class="base" id="first"></div>
    <div class="base" id="second"></div>

<script>
async function loadScore() {
  try {
    // ✅ Get today's game
    const res = await fetch(
      "https://statsapi.mlb.com/api/v1/schedule?sportId=11&teamId=552&date=2026-06-23"
    );
    const sched = await res.json();

    const game = sched.dates[0]?.games[0];
    if (!game) return;

    // ✅ Team names
    document.getElementById("awayTeam").innerText =
      game.teams.away.team.name;

    document.getElementById("homeTeam").innerText =
      game.teams.home.team.name;

    // ✅ Logos
    document.getElementById("awayLogo").src =
      "https://www.mlbstatic.com/team-logos/" +
      game.teams.away.team.id + ".svg";

    document.getElementById("homeLogo").src =
      "https://www.mlbstatic.com/team-logos/" +
      game.teams.home.team.id + ".svg";

    // ✅ Venue
    document.getElementById("venue").innerText =
      game.venue.name;

    // ✅ Records (if elements exist)
    const awayRecordEl = document.getElementById("awayRecord");
    const homeRecordEl = document.getElementById("homeRecord");

    if (awayRecordEl && homeRecordEl) {
      awayRecordEl.innerText =
        game.teams.away.leagueRecord.wins + "-" +
        game.teams.away.leagueRecord.losses;

      homeRecordEl.innerText =
        game.teams.home.leagueRecord.wins + "-" +
        game.teams.home.leagueRecord.losses;
    }

    // ✅ Get live data
    const liveRes = await fetch(
      `https://statsapi.mlb.com/api/v1.1/game/${game.gamePk}/feed/live`
    );
    const live = await liveRes.json();

    const status = game.status.detailedState;
    const linescore = live.liveData?.linescore;

    // ✅ Format time (no seconds)
    const gameTime = new Date(game.gameDate).toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit"
    });

    // ✅ SCORE
    const scoreEl = document.getElementById("score");

// ✅ If NOT started yet → show date/time in score position
if (!status.includes("In Progress") && status !== "Final") {
  const gameDateObj = new Date(game.gameDate);
  const now = new Date();

  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const gameDay = new Date(
    gameDateObj.getFullYear(),
    gameDateObj.getMonth(),
    gameDateObj.getDate()
  );

  const diff = (gameDay - today) / (1000 * 60 * 60 * 24);

  let dateLabel = "";

  if (diff === 0) {
    dateLabel = "Today";
  } else if (diff === 1) {
    dateLabel = "Tomorrow";
  } else {
    dateLabel = gameDateObj.toLocaleDateString([], {
      month: "short",
      day: "numeric"
    });
  }

  scoreEl.innerText = dateLabel + " - " + gameTime;

} else {
  // ✅ Game live or final → show actual score
  scoreEl.innerText =
    (linescore?.teams.away.runs || 0) + " - " +
    (linescore?.teams.home.runs || 0);
}

    // ✅ INNING / STATUS
    const inningEl = document.getElementById("inning");
inningEl.className = "";

// ✅ Pregame → hide
if (!status.includes("In Progress") && status !== "Final") {
  inningEl.innerText = "";

// ✅ Final
} else if (status === "Final") {
  inningEl.innerText = "FINAL";
  inningEl.classList.add("inning-final");

// ✅ Live
} else if (status.includes("In Progress")) {
  inningEl.innerText =
    (linescore.inningState || "") + " " +
    (linescore.currentInningOrdinal || "");
  inningEl.classList.add("inning-live");
}

    // ✅ OUTS
    const outsEl = document.getElementById("outs");
    if (outsEl) {
      outsEl.innerText = "";
      if (linescore && status.includes("In Progress")) {
        const outs = linescore.outs;
        outsEl.innerText = outs + " Out" + (outs !== 1 ? "s" : "");
      }
    }

    // ✅ MATCHUP
    const matchupEl = document.getElementById("matchup");
    matchupEl.innerText = "";

    if (
      status.includes("In Progress") &&
      live.liveData?.plays?.currentPlay?.matchup
    ) {
      const m = live.liveData.plays.currentPlay.matchup;

      matchupEl.innerText =
        "P: " + m.pitcher.fullName +
        " vs B: " + m.batter.fullName;

    } else if (!linescore) {
      const awayP = game.teams.away.probablePitcher;
      const homeP = game.teams.home.probablePitcher;

      if (awayP && homeP) {
        matchupEl.innerText =
          "Probable: " +
          awayP.fullName + " vs " +
          homeP.fullName;
      }

    } else if (status === "Final" && live.liveData?.decisions) {
      const win = live.liveData.decisions.winner;
      const loss = live.liveData.decisions.loser;

      if (win && loss) {
        matchupEl.innerText =
          "W: " + win.fullName + " | L: " + loss.fullName;
      }
    }

    // ✅ BASE RUNNERS
    const diamond = document.getElementById("diamond");

    if (diamond) {
      diamond.style.display = "none";

      ["first", "second", "third"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.remove("active");
      });

      if (
        status.includes("In Progress") &&
        linescore?.offense
      ) {
        diamond.style.display = "block";

        if (linescore.offense.first) {
          document.getElementById("first").classList.add("active");
        }
        if (linescore.offense.second) {
          document.getElementById("second").classList.add("active");
        }
        if (linescore.offense.third) {
          document.getElementById("third").classList.add("active");
        }
      }
    }

    // ✅ LINEUPS
    const box = live.liveData?.boxscore;

    if (box) {
      function buildLineup(teamBox, label) {
        const order = teamBox.battingOrder;

        if (!order || order.length === 0) {
          return "<strong>" + label + ":</strong><br>Not available";
        }

        const players = order.map(id =>
          teamBox.players["ID" + id].person.fullName
        );

        return "<strong>" + label + ":</strong><br>" +
          players.map((p, i) => (i + 1) + ". " + p).join("<br>");
      }

      document.getElementById("awayLineup").innerHTML =
        buildLineup(box.teams.away, "Away");

      document.getElementById("homeLineup").innerHTML =
        buildLineup(box.teams.home, "Home");
    }

  } catch (e) {
    console.log("ERROR:", e);
  }
}

// ✅ Run + refresh
loadScore();
setInterval(loadScore, 15000);

</script>  
</body>
  </html>
