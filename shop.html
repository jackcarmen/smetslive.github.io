<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        background: #004b8d;
        color: white;
        font-family: Arial;
        margin: 20px;
      }

      #products {
        display: grid;
        grid-template-columns: repeat(auto-fill,minmax(250px,1fr));
        gap: 20px;
      }

      .product {
        background: rgba(255,255,255);
        color: black;

        display: flex;
        flex-direction: column;

        box-sizing: border-box;
        height: 400px;
        
        border-radius: 12px;
        border: 1px solid black;
        
        padding: 15px;
      }

      .imageContainer {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 0;
      }

      .imageContainer img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }

      .productInfo {
        flex-shrink: 0;
      }
      
      .productInfo h3{
        margin: 0;
        font-size: 16px;
      }
      
      .price {
        color: #f47d30;
        font-weight: bold;
        margin-top: 6px;
      }

      #productDetail {
        background: white;
        color: black;
      
        border-radius: 12px;
        padding: 20px;
      }
      
      #productDetail img {
        width: 100%;
        max-height: 500px;
        object-fit: contain;
      }
      
      .detailPrice {
        color: #f47d30;
        font-size: 24px;
        font-weight: bold;
        margin: 10px 0;
      }
      
      .backButton,
      .buyButton {
        border: none;
        border-radius: 8px;
        padding: 12px 20px;
        cursor: pointer;
        font-size: 16px;
      }
      
      .backButton {
        background: #ddd;
        margin-bottom: 20px;
      }
      
      .buyButton {
        background: #f47d30;
        color: white;
        margin-top: 20px;
      }
    </style>
  </head>
<body>

  <h1>Shop Syracuse Mets Merchandise</h1>

  <div id="products"></div>

  <div id="productDetail" style="display:none;"></div>

  <script>

    let allProducts = [];

function showProduct(index) {

  const product = allProducts[index];

  const image =
    product.images?.[0]?.src || "";

  const price =
    product.variants?.[0]?.price || "";

  const description =
    product.body_html || "";

  const productUrl =
    "https://milbshop.com/products/" +
    product.handle;

  document.getElementById("products").style.display = "none";

  const detail =
    document.getElementById("productDetail");

  detail.style.display = "block";

  detail.innerHTML = `
    <button class="backButton" onclick="goBack()">
      ← Back
    </button>

    ${image}

    <h2>${product.title}</h2>

    <div class="detailPrice">
      $${price}
    </div>

    <div>
      ${description}
    </div>

    ${productUrl}
      <button class="buyButton">
        Buy Now
      </button>
    </a>
  `;
}

function goBack() {

  document.getElementById("productDetail").style.display = "none";

  document.getElementById("products").style.display = "grid";

}
    
    fetch("https://milbshop.com/collections/syracuse/products.json?limit=300")
  .then(r => r.json())
  .then(data => {
allProducts = data.products;
    
    const products =
      document.getElementById("products");

    data.products.forEach((product,index) => {

      const image =
        product.images?.[0]?.src || "";

      const price =
        product.variants?.[0]?.price || "";

      products.innerHTML += `
        <div class="product"
        onclick="showProduct(${index})"
        style="cursor:pointer;">

          <div class="imageContainer">
          <img src="${image}" alt="${product.title}">
          </div>

          <div class="productInfo">

            <h3>${product.title}</h3>

            <div class="price">
              $${price}
            </div>

          </div>

        </div>
      `;

    });

  })
  .catch(error => {
    console.log(error);
  });
  </script>
</body>
  
</html>
