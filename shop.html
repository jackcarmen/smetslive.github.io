<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background: transparent;
      color: white;
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    #filters {
position: relative;
width: 100%;
max-width: 300px;
margin-bottom: 20px;
}

.filterDropdown {
position: relative;
width: 100%;
}

.filterToggle {
display: flex;
align-items: center;
justify-content: space-between;
width: 100%;
padding: 12px 16px;
background: white;
color: black;
border: 2px solid black;
border-radius: 8px;
font-size: 16px;
font-weight: bold;
text-align: left;
cursor: pointer;
}

.filterArrow {
margin-left: 12px;
transition: transform 0.2s ease;
}

.filterDropdown.open .filterArrow {
transform: rotate(180deg);
}

.filterOptions {
display: none;
position: absolute;
top: calc(100% + 4px);
left: 0;
width: 100%;
background: white;
border: 2px solid black;
border-radius: 8px;
overflow: hidden;
box-sizing: border-box;
z-index: 100;
}

.filterDropdown.open .filterOptions {
display: block;
}

.filterOption {
display: block;
width: 100%;
padding: 12px 16px;
background: white;
color: black;
border: none;
border-bottom: 1px solid #ddd;
font-size: 15px;
text-align: left;
cursor: pointer;
box-sizing: border-box;
}

.filterOption:last-child {
border-bottom: none;
}

.filterOption:hover,
.filterOption.active {
background: #f47d30;
color: white;
}
    
    #products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      color: black;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      height: 400px;
      border-radius: 12px;
      border: 4px solid black;
      padding: 15px;
      cursor: pointer;
    }

    .imageContainer {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      overflow: hidden;
    }

    .imageContainer img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .productInfo {
      flex-shrink: 0;
    }

    .productInfo h3 {
      margin: 0;
      font-size: 16px;
    }

    .price {
      color: #f47d30;
      font-weight: bold;
      margin-top: 6px;
    }

    /* PRODUCT DETAILS */
    #productDetail {
      display: none;
      background: white;
      color: black;
      border-radius: 12px;
      padding: 20px;
    }

    .detailImageContainer {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px 0;
    }

    #productDetail .detailImage {
      display: block;
      max-width: 100%;
      width: auto;
      height: auto;
      max-height: 500px;
      object-fit: contain;
    }

    .detailPrice {
      color: #f47d30;
      font-size: 24px;
      font-weight: bold;
      margin: 10px 0;
    }

    .backButton,
    .buyButton {
      display: inline-block;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
      font-size: 16px;
      text-decoration: none;
      box-sizing: border-box;
    }

    .backButton {
      background: #ddd;
      color: black;
      margin-bottom: 20px;
    }

    .buyButton {
      background: #f47d30;
      color: white;
      margin-top: 20px;
    }

    .buyButton:hover {
      background: #d9661e;
    }

    .backButton:hover {
      background: #ccc;
    }

    .detailDescription {
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .detailDescription img {
      max-width: 100%;
      height: auto;
    }

    .contactInfo {
      margin-top: 15px;
      color: #f47d30;
      font-weight: bold;
    }
    
    .contactInfo,
    .contactInfo a,
    .contactinfo a:visited,
    .contactInfo a:hover,
    .contactInfo a:active {
      color: #f47d30;
    }
  </style>
</head>

<body>

  <h1>Browse Syracuse Mets Merchandise</h1>

  <div id="filters"></div>
  
  <div id="products"></div>

  <div id="productDetail"></div>

    <script>
    let allProducts = [];

    // ======================
    // PRODUCT DETAILS
    // ======================

    function showProduct(index) {
      const product = allProducts[index];

      if (!product) return;

      const image = product.images?.[0]?.src || "";
      const price = product.variants?.[0]?.price || "";
      const description = product.body_html || "";

      const productUrl =
        "https://milbshop.com/products/" + product.handle;

      document.getElementById("products").style.display = "none";
      document.querySelector("h1").style.display = "none";
      document.getElementById("filters").style.display = "none";

      const detail = document.getElementById("productDetail");
      detail.style.display = "block";

      detail.innerHTML = `
        <button class="backButton" onclick="goBack()">
          ← Back to Products
        </button>

        <div class="detailImageContainer">
          ${
            image
              ? `<img class="detailImage" src="${image}" alt="${product.title}">`
              : "<p>Product image unavailable</p>"
          }
        </div>

        <h2>${product.title}</h2>

        <div class="detailPrice">
          $${price}
        </div>

        <div class="detailDescription">
          ${description}
        </div>

        <a
          href="${productUrl}"
          target="_blank"
          rel="noopener noreferrer"
          class="buyButton"
        >
          Buy Now
        </a>

        <div class="contactInfo">
          Questions? Email
          <a href="mailto:cchawgo@syracusemets.com">
            cchawgo@syracusemets.com
          </a>
        </div>
      `;

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function goBack() {
      document.getElementById("productDetail").style.display = "none";
      document.getElementById("products").style.display = "grid";
      document.querySelector("h1").style.display = "block";
      document.getElementById("filters").style.display = "block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    // ======================
    // FILTER DROPDOWN
    // ======================

    function buildFilters() {
      const filters = document.getElementById("filters");

      filters.innerHTML = "";

      const dropdown = document.createElement("div");
      dropdown.className = "filterDropdown";

      const toggle = document.createElement("button");
      toggle.className = "filterToggle";
      toggle.type = "button";

      toggle.innerHTML = `
        <span id="filterLabel">Filter: All</span>
        <span class="filterArrow">▼</span>
      `;

      const options = document.createElement("div");
      options.className = "filterOptions";

      const productTypes = [
        "All",
        ...new Set(
          allProducts
            .map(product => product.product_type)
            .filter(Boolean)
            .sort((a, b) => a.localeCompare(b))
        )
      ];

      productTypes.forEach(type => {
        const button = document.createElement("button");

        button.className = "filterOption";
        button.type = "button";
        button.textContent = type;

        if (type === "All") {
          button.classList.add("active");
        }

        button.onclick = () => {
          filterProducts(type);

          document.getElementById("filterLabel").textContent =
            `Filter: ${type}`;

          options.querySelectorAll(".filterOption").forEach(option => {
            option.classList.remove("active");
          });

          button.classList.add("active");
          dropdown.classList.remove("open");
        };

        options.appendChild(button);
      });

      toggle.onclick = () => {
        dropdown.classList.toggle("open");
      };

      // Close dropdown when clicking outside
      document.addEventListener("click", event => {
        if (!dropdown.contains(event.target)) {
          dropdown.classList.remove("open");
        }
      });

      dropdown.appendChild(toggle);
      dropdown.appendChild(options);
      filters.appendChild(dropdown);
    }

    // ======================
    // FILTER PRODUCTS
    // ======================

    function filterProducts(type) {
      if (type === "All") {
        renderProducts(allProducts);
        return;
      }

      const filtered = allProducts.filter(product =>
        product.product_type === type
      );

      renderProducts(filtered);
    }

    // ======================
    // PRODUCT GRID
    // ======================

    function renderProducts(productsToRender) {
      const products = document.getElementById("products");

      products.innerHTML = "";

      productsToRender.forEach(product => {
        const image = product.images?.[0]?.src || "";
        const price = product.variants?.[0]?.price || "";
        const index = allProducts.indexOf(product);

        const card = document.createElement("div");
        card.className = "product";

        card.onclick = () => showProduct(index);

        card.innerHTML = `
          <div class="imageContainer">
            ${
              image
                ? `<img src="${image}" alt="${product.title}">`
                : "<p>Image unavailable</p>"
            }
          </div>

          <div class="productInfo">
            <h3>${product.title}</h3>

            <div class="price">
              $${price}
            </div>
          </div>
        `;

        products.appendChild(card);
      });
    }

    // ======================
    // LOAD PRODUCTS
    // ======================

    fetch("https://milbshop.com/collections/syracuse/products.json?limit=300")
      .then(response => {
        if (!response.ok) {
          throw new Error(
            "Unable to load products: " + response.status
          );
        }

        return response.json();
      })
      .then(data => {
  const products = data.products || [];

  // Keep only products with at least one available variant
  allProducts = products.filter(product =>
    product.variants?.some(variant => variant.available === true)
  );

  buildFilters();
  renderProducts(allProducts);
})
      .catch(error => {
        console.error("Error loading products:", error);

        document.getElementById("products").innerHTML =
          "<p>Sorry, merchandise could not be loaded. Please try again later.</p>";
      });
  </script>


</body>
</html>
