<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background: transparent;
      color: white;
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      color: black;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      height: 400px;
      border-radius: 12px;
      border: 4px solid black;
      padding: 15px;
      cursor: pointer;
    }

    .imageContainer {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      overflow: hidden;
    }

    .imageContainer img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .productInfo {
      flex-shrink: 0;
    }

    .productInfo h3 {
      margin: 0;
      font-size: 16px;
    }

    .price {
      color: #f47d30;
      font-weight: bold;
      margin-top: 6px;
    }

    /* PRODUCT DETAILS */
    #productDetail {
      display: none;
      background: white;
      color: black;
      border-radius: 12px;
      padding: 20px;
    }

    .detailImageContainer {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px 0;
    }

    #productDetail .detailImage {
      display: block;
      max-width: 100%;
      width: auto;
      height: auto;
      max-height: 500px;
      object-fit: contain;
    }

    .detailPrice {
      color: #f47d30;
      font-size: 24px;
      font-weight: bold;
      margin: 10px 0;
    }

    .backButton,
    .buyButton {
      display: inline-block;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
      font-size: 16px;
      text-decoration: none;
      box-sizing: border-box;
    }

    .backButton {
      background: #ddd;
      color: black;
      margin-bottom: 20px;
    }

    .buyButton {
      background: #f47d30;
      color: white;
      margin-top: 20px;
    }

    .buyButton:hover {
      background: #d9661e;
    }

    .backButton:hover {
      background: #ccc;
    }

    .detailDescription {
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .detailDescription img {
      max-width: 100%;
      height: auto;
    }

    .contactInfo {
      margin-top: 15px;
      color: #f47d30;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>Shop Syracuse Mets Merchandise</h1>

  <div id="products"></div>

  <div id="productDetail"></div>

  <script>
    let allProducts = [];

    // OPEN PRODUCT DETAILS
    function showProduct(index) {

      const product = allProducts[index];

      if (!product) return;

      const image = product.images?.[0]?.src || "";
      const price = product.variants?.[0]?.price || "";
      const description = product.body_html || "";
      const productUrl =
        "https://milbshop.com/products/" + product.handle;

      document.getElementById("products").style.display = "none";

      const detail = document.getElementById("productDetail");
      detail.style.display = "block";

      detail.innerHTML = `
        <button class="backButton" onclick="goBack()">
          &#8592; Back to Products
        </button>

        <div class="detailImageContainer">
          ${
            image
              ? `<img
                   class="detailImage"
                   src="${image}"
                   alt="${product.title}"
                   onerror="this.alt='Product image unavailable'; this.style.display='none';"
                 >`
              : `<p>Product image unavailable</p>`
          }
        </div>

        <h2>${product.title}</h2>

        <div class="detailPrice">
          $${price}
        </div>

        <div class="detailDescription">
          ${description}
        </div>

        <a
          class="buyButton"
          href="${productUrl}"
          target="_blank"
          rel="noopener noreferrer"
        >
          Buy Now
        </a>
        <div class="contactInfo">
        Questions? Email <a href="mailto:cchawgo@syracusemets.com">cchawgo@syracusemets.com</a>
</div>
      `;

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    // RETURN TO PRODUCT GRID
    function goBack() {

      document.getElementById("productDetail").style.display = "none";

      document.getElementById("products").style.display = "grid";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    // LOAD PRODUCTS
    fetch("https://milbshop.com/collections/syracuse/products.json?limit=300")
      .then(response => {
        if (!response.ok) {
          throw new Error("Unable to load products: " + response.status);
        }

        return response.json();
      })
      .then(data => {

        allProducts = data.products || [];

        const products = document.getElementById("products");

        products.innerHTML = "";

        allProducts.forEach((product, index) => {

          const image = product.images?.[0]?.src || "";
          const price = product.variants?.[0]?.price || "";

          const card = document.createElement("div");
          card.className = "product";
          card.onclick = () => showProduct(index);

          card.innerHTML = `
            <div class="imageContainer">
              ${
                image
                  ? `<img src="${image}" alt="${product.title}"
                       onerror="this.style.visibility='hidden'">`
                  : `<p>Image unavailable</p>`
              }
            </div>

            <div class="productInfo">
              <h3>${product.title}</h3>

              <div class="price">
                $${price}
              </div>
            </div>
          `;

          products.appendChild(card);
        });

      })
      .catch(error => {
        console.error("Error loading products:", error);

        document.getElementById("products").innerHTML =
          "<p>Sorry, merchandise could not be loaded. Please try again later.</p>";
      });
  </script>

</body>
</html>
