<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        background: #004b8d;
        color: white;
        font-family: Arial;
        margin: 20px;
      }

      #products {
        display: grid;
        grid-template-columns: repeat(auto-fill,minmax(250px,1fr));
        gap: 20px;
      }

      .product {
        background: rgba(255,255,255);
        color: black;

        display: flex;
        flex-direction: column;

        box-sizing: border-box;
        height: 400px;
        
        border-radius: 12px;
        border: 1px solid black;
        
        padding: 15px;
      }

      .imageContainer {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 0;
      }

      .imageContainer img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }

      .productInfo {
        flex-shrink: 0;
      }
      
      .productInfo h3{
        margin: 0;
        font-size: 16px;
      }
      
      .price {
        color: #f47d30;
        font-weight: bold;
        margin-top: 6px;
      }
    </style>
  </head>
<body>

  <h1>Shop Syracuse Mets Merchandise</h1>

  <div id="products"></div>

  <script>

    fetch("https://milbshop.com/collections/syracuse/products.json?limit=10")
    .then(r => r.json())
    .then(data => {
      const products = 
        document.getElementById("products");

      data.products.forEach(product => {
        const image = product.images?.[0]?.src || "";
        const price = product.variants?.[0]?.price || "";
        
        products.innerHTML += `
        <div class="product">
        <div class="imageContainer">
        ${image}
        </div>
        <div class="productInfo">
        <h3>${product.title}</h3>
        <div class="price">
        $${price}
        </div>
        </div>
        </div>`;
      });
    });
  </script>
</body>
  
</html>
